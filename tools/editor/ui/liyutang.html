<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>黎语堂 · 管理</title>
    <!--
      黎语堂自己的管理系统（2026-10-06 建）。

      用户原话：
        「黎语堂是一个本网站的静态论坛 有很多论坛独有的功能 所以不要将其接入原有的
         编辑器系统 应当在花娅陌质流里加一个新按钮跳转到黎语堂相关的编辑管理上
         但是在花涧堂编辑器的页面内可以管理黎语堂这个板块卡片的标题 副标题 背景图片」

      所以这一页**故意不是**花涧堂编辑器的一个面板：
        · 它只认 src/data/liyutang.json（论坛的版块 + 评论系统），不碰文章 / 手记 / 版块树；
        · 花涧堂编辑器那边只多一颗按钮跳过来（右上角「黎语堂管理」），外加一个
          「黎语堂」面板管首页那张卡片的标题 / 副标题 / 背景图（写 home-widgets.json）。
      这么分是因为论坛以后要长出自己的版块、帖子、权限、评论，塞进「文章 / 手记」
      那套 type 里两边会互相牵扯。

      样式复用编辑器的 /style.css（.btn / .input / .hint / .toast / .wbox），
      页面自己那点布局写在下面的 <style> 里。
    -->
    <link rel="stylesheet" href="/style.css" />
    <style>
      /*
        ⚠⚠ 这一页要能滚（2026-10-10 修）。

        用户原话：「黎语堂管理里很多地方根本无法进行编辑」——鼠标滚轮推不下去，
        版块 / 页面文案 / 帖子管理 / 评论系统四块（全在下半截）根本够不着。

        为什么会被滚不动：上面 <link> 那个共用的 /style.css 是给**三栏编辑器**
        （ui/index.html）写的，它第 74-88 行把 html / body 钉成
            html, body { height: 100% }        body { overflow: hidden }
        —— 三栏编辑器每一栏是 .col（overflow: hidden）、栏里 .col__body（overflow: auto）
        自己滚，所以外层**绝不能**滚，那两条是那套布局的地基，改不得。

        可这一页**不是三栏**：它是一整篇往下排的文档（sticky 顶栏 + main 里依次
        用户审核 / 大厅 / 版块 / 页面文案 / 帖子管理 / 评论系统六块 .wbox）。
        套上那两条之后坏了两处（都是验收脚本实测出来的）：
          · body 被钉成一屏高、多出来的内容被裁掉 → **滚轮推不动**（滚之前量到
            body.overflow=hidden；打一次真滚轮，scrollY 纹丝不动还是 0）；
          · sticky 顶栏跟着坏：粘性元素的约束矩形是它的**包含块**，body 只有一屏高，
            顶栏粘到 816px（900 - 顶栏高）就被 body 的底边带走 —— 滚到底量到
            .lytadmin__top 的 top = -2065，等于根本没粘住。

        ⚠ 头一条特别容易测漏：overflow: hidden 的盒子**仍然是滚动容器**，
        它挡的是滚轮 / 触摸 / 滚动条，脚本 window.scrollTo 照样能滚（这里实测
        scrollTo(0, 99999) 在改之前也能滚到 2881）。所以"只断言 scrollTo"的验收
        在改之前也会全绿、靠不住 —— 验收脚本
        tools/checks/editor-liyutang-scroll-check.mjs 里是**打真滚轮**量的。

        修法：这份内联样式只有这一页加载（天然碰不到三栏编辑器），并且**只挂在
        body.lytadmin 上** —— 选择器比 style.css 的 body 更具体、又排在后面，稳赢，
        于是只把这一页该有的两条还回来：
          · height: auto    —— body 随内容长高，sticky 的包含块变成整篇文档，粘得住；
          · overflow: visible —— 滚动交还给视口（滚轮 / 滚动条 / 触摸都回来）。
        ⚠ html 不用动：style.css 给 html 的 height: 100% 不裁剪任何东西，body 长高后
        文档照样滚（改后实测滚轮能一路推到底、顶栏 top 恒为 0）；坏事的只有 body 两条。
        ⚠ 别把这两条写进共用 /style.css —— 三栏编辑器就靠那两条活着。
      */
      body.lytadmin {
        margin: 0;
        min-height: 100vh; /* 内容不够一屏时也别塌（原来那条，意思留着） */
        height: auto;
        overflow: visible;
        background: var(--bg);
        color: var(--text);
      }

      .lytadmin__top {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
      }
      .lytadmin__brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1 1 320px;
      }
      .lytadmin__brand strong {
        font-size: 15px;
        letter-spacing: 0.06em;
      }
      .lytadmin__brand .hint {
        margin: 0;
      }
      .lytadmin__acts {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .lytadmin__main {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 1000px;
        margin: 0 auto;
        padding: 18px 16px 60px;
      }

      .lytadmin__status {
        margin: 0;
        min-height: 1.4em;
        font-size: 12.5px;
        color: var(--text-muted);
      }
      .lytadmin__status.is-dirty {
        color: var(--accent);
      }

      /* 版块：一行一块（标题 / 说明 / 图标 + 上下挪 + 删） */
      .lt-board {
        display: grid;
        grid-template-columns: 2.6rem minmax(0, 1fr);
        gap: 8px 10px;
        align-items: start;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .lt-board__icon {
        width: 100%;
        text-align: center;
        font-size: 18px;
      }
      .lt-board__fields {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .lt-board__row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .lt-board__row .input {
        flex: 1 1 200px;
        min-width: 0;
      }
      .lt-board__ops {
        display: flex;
        gap: 4px;
      }
      .lt-empty {
        padding: 10px;
        border: 1px dashed var(--border-strong);
        border-radius: 10px;
        color: var(--text-muted);
        font-size: 13px;
      }

      /* 版块公告是一段 Markdown，多行 —— 占满整行，改起来看得见自己写了什么 */
      .lt-board__notice {
        min-height: 62px;
        font-family: var(--font-mono);
        font-size: 12.5px;
      }

      /*
        「盘上那份被别处改过」那条提示（2026-10-09）：整条横在页面最上面那行状态下面，
        一眼就能看见 —— 这条消息本身就是这次保存**没写进去**的原因，不能藏在角落。
      */
      .lt-stale {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 10px 12px;
        border: 1px solid var(--danger);
        border-radius: 10px;
        background: color-mix(in srgb, var(--danger) 10%, transparent);
        font-size: 13px;
        line-height: 1.7;
      }
      .lt-stale__text {
        flex: 1 1 320px;
        min-width: 0;
      }

      /* 帖子管理：一条帖子一行，标题能点开、摘要只留一行（列表是给人扫的） */
      .lt-post__title {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 2px;
        word-break: break-word;
      }
      .lt-post__avatar {
        display: block;
        width: 26px;
        height: 26px;
        margin: 0 auto;
        border-radius: 50%;
        object-fit: cover;
      }
      .lt-post__excerpt {
        font-size: 12.5px;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lt-post__move {
        flex: 0 1 9rem;
        min-width: 0;
      }

      /* 评论系统那几个字段：label 在左、控件在右，和编辑器面板一个手感 */
      .lt-field {
        display: grid;
        grid-template-columns: 8.5rem minmax(0, 1fr);
        gap: 8px;
        align-items: center;
      }
      .lt-field > label {
        font-size: 12.5px;
        color: var(--text-muted);
      }
      .lt-field .input {
        width: 100%;
      }
      .lt-check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .lt-sub {
        margin: 4px 0 0;
        padding-top: 8px;
        border-top: 1px dashed var(--border);
        font-size: 12.5px;
        color: var(--text-muted);
        line-height: 1.8;
      }

      /* 页面文案：一组一条小标题（茶绘画板页 / 聊天室 …），组里每个字段一行（label 左、文本域右） */
      .lt-copy__group {
        margin: 10px 0 2px;
        font-size: 12.5px;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }
      .lt-copy__group:first-child {
        margin-top: 0;
      }
      .lt-copy__field {
        min-height: 46px;
        font-size: 12.5px;
      }
      /* 文案字段是"一段话"，label 顶对齐更好读（其余 .lt-field 仍然居中） */
      .lt-copy__row {
        align-items: start;
      }
      .lt-copy__row > label {
        padding-top: 6px;
      }
      .lt-copy__count {
        color: var(--text-muted);
      }
      @media (max-width: 620px) {
        .lt-field {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body class="lytadmin">
    <header class="lytadmin__top">
      <div class="lytadmin__brand">
        <strong>黎语堂 · 管理</strong>
        <span class="hint">
          黎语堂自己的管理系统，和花涧堂编辑器分开：大厅、版块和评论系统写 src/data/liyutang.json，
          用户审核和帖子管理的数据在腾讯云函数里（这里只是转发 + 显示）。
          首页那张卡片的标题 / 副标题 / 背景图在花涧堂编辑器的「黎语堂」面板里。
        </span>
      </div>
      <div class="lytadmin__acts">
        <button type="button" class="btn btn--ghost" id="lt-open-site" title="在新标签页打开站点上的黎语堂（要先构建过）">
          打开 /liyutang/
        </button>
        <button type="button" class="btn btn--ghost" id="lt-open-editor" title="回到花涧堂编辑器">
          回到花涧堂编辑器
        </button>
        <button type="button" class="btn btn--primary" id="lt-save" title="写进 src/data/liyutang.json 并重新构建站点">
          保存并重新构建
        </button>
      </div>
    </header>

    <main class="lytadmin__main">
      <p class="lytadmin__status" id="lt-status">正在读取…</p>

      <!--
        「盘上那份在你打开这一页之后被改过」时的那条提示（2026-10-09 加）。
        平时是 hidden 的；保存被 409 拒掉时由 liyutang.js 的 showStale() 填上——
        里面会有一句中文说明 + 一颗「重新载入这一页」（location.reload()）。
        ⚠ 故意**不自动重载**：页面上还有用户刚写的东西，一 reload 就没了。
      -->
      <div class="lt-stale" id="lt-stale" hidden></div>

      <!--
        用户审核放在**最上面**（2026-10-07）：站长进这一页最常干的事就是「谁注册了、要不要过」，
        放最底下会被评论系统那一大块埋掉（真被埋过一次，用户找不到）。
      -->
      <section class="wbox" id="lt-users-box"></section>
      <!--
        大厅排在「用户审核」之后、「版块」之前（2026-10-09 加）：
        论坛首页最上面就是那两块大的（聊天室 / 久昭卿茶绘），版块排在它们下面 ——
        页面上的顺序和站点上一致，改的时候不用在脑子里翻译一遍。
      -->
      <section class="wbox" id="lt-halls-box"></section>
      <section class="wbox" id="lt-boards-box"></section>
      <!--
        页面文案（2026-10-09 加）：站点上那些"介绍 / 提示"文字全在这里填（写 liyutang.json 的 copy 区）。

        为什么要单开一块：用户原话「当前的黎语堂网站里充斥着过多你自己胡编乱造的提示和简介 ……
        请你全部删掉全部这一类你自己生造的句子 并且给对应的位置留下编辑器接口」——
        所以站点页面里一个字都不写死了，站长在这儿填什么，页面上就长什么样；留空 = 那个位置不显示。
        位置排在「版块」后面：它和版块 / 大厅一样是配置，一年动不了几次，但比帖子管理更靠前
        （帖子是天天要动手的日常，见下面那条注释）。
      -->
      <section class="wbox" id="lt-copy-box"></section>
      <!--
        帖子管理夹在「版块」和「评论系统」**中间**（2026-10-07 加）：
        上面那两块是配置（一年动不了几次），这一块是天天要动手的日常
        （隐藏 / 置顶 / 挪版块 / 删），放评论系统前面省得每次往下翻。
      -->
      <section class="wbox" id="lt-posts-box"></section>
      <section class="wbox" id="lt-forum-box"></section>
    </main>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="/liyutang.js"></script>
  </body>
</html>
