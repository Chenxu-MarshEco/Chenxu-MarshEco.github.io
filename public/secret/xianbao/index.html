<!--
  空弦 & 疑问的雕像 · Spine 3.8 网页演示
  ─────────────────────────────────────────────
  目录约定（拷到 GitHub Pages / 博客子目录即可用）：
    index.html
    runtime/spine-webgl.js                                 Spine 3.8 Web 运行时
    archet_idle/build_char_332_archet.{skel,atlas,png}     空弦·基建待机（循环）
    archet_battle/char_332_archet.{skel,atlas,png}         空弦·战斗（点击触发攻击）
    statue/enemy_10157_mnggyl.{skel,atlas,png}             疑问的雕像（待机）
  ⚠ 必须用 http(s) 打开（本地：双击同目录的“启动本地服务.cmd”）；file:// 读不到贴图。
  ⚠ 素材版权属鹰角网络，仅供同人展示，勿用于商业。
-->
<style>
  /* ===========================================================================
   *  这一页在 public/ 下，构建时被原样拷进 dist，**不经过 Astro**，
   *  所以引不到站点那份带 hash 的 CSS。下面把用到的设计令牌按同名变量内联，
   *  取值一律照抄 src/styles/tokens.css，不自己配色：
   *    --c-bg:#e8d0dd          （与 tokens.css 的 --c-bg 对齐）
   *    --c-bg-raised:#fdf7fb   （与 tokens.css 的 --c-bg-raised 对齐）
   *    --c-text:#46280f        （与 tokens.css 的 --c-text 对齐）
   *    --c-text-muted:#6f3f10  （与 tokens.css 的 --c-text-muted 对齐）
   *    --c-border:#d3aec3      （与 tokens.css 的 --c-border 对齐）
   *    --r-lg:14px             （与 tokens.css 的 --r-lg 对齐）
   *    --shadow-md / --c-selection / --font-sans / --font-display 同上
   *  字体只写字体栈名：'Huajiantang' 在站点里是分片 woff2，这一页不引字体文件，
   *  浏览器没有就自动落到后面的系统字体。
   * ======================================================================== */
  :root{
    --c-bg:#e8d0dd;                                  /* 与 tokens.css 的 --c-bg 对齐 */
    --c-bg-raised:#fdf7fb;                           /* 与 tokens.css 的 --c-bg-raised 对齐 */
    --c-text:#46280f;                                /* 与 tokens.css 的 --c-text 对齐 */
    --c-text-muted:#6f3f10;                          /* 与 tokens.css 的 --c-text-muted 对齐 */
    --c-border:#d3aec3;                              /* 与 tokens.css 的 --c-border 对齐 */
    --c-selection:#edc6db;                           /* 与 tokens.css 的 --c-selection 对齐 */
    --r-lg:14px;                                     /* 与 tokens.css 的 --r-lg 对齐 */
    --shadow-md:0 4px 16px -4px rgb(30 25 20 / .10); /* 与 tokens.css 的 --shadow-md 对齐 */
    --font-sans:'Huajiantang',system-ui,-apple-system,"Segoe UI","PingFang SC",
      "Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --font-display:'Huajiantang',Georgia,"Songti SC","Noto Serif SC",serif;
  }
  /* 背景与 global.css 的 body 一致：--c-bg 一个平色铺满（站内浅色页就是这么画的，
     没有叠渐变或图案）。原来是 #eef2f0 的灰白，看着跟站里不是一套。 */
  body{
    margin:0; min-height:100vh;
    background:var(--c-bg); color:var(--c-text);
    font:16px/1.75 var(--font-sans);
    -webkit-font-smoothing:antialiased;
    padding-bottom:2.75rem;   /* 给右下角落款留一条，短页面也不会压住正文 */
  }
  ::selection{ background:var(--c-selection); }
  .wrap{ max-width:1000px; margin:24px auto; padding:0 16px; }
  h1{ font-family:var(--font-display); font-size:1.05rem; color:var(--c-text); font-weight:600; letter-spacing:.06em; }
  /* 舞台外框：和 global.css 里的 .card 用同一套写法
     （--c-bg-raised 底 + 1px --c-border 描边 + --r-lg 圆角 + --shadow-md 投影），
     只把内边距收小一点，让画面像一张裱起来的画；宽度全部是百分比，窄屏不写死。 */
  .stageCard{
    padding:clamp(8px,1.2vw,14px);
    background:var(--c-bg-raised);
    border:1px solid var(--c-border);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow-md);
  }
  .stage{
    position:relative; height:clamp(300px,46vw,440px); border-radius:14px; overflow:hidden;
    background:url('./stage.webp') center/100% 100% no-repeat;
    box-shadow:inset 0 0 60px rgba(0,0,0,.12);
  }
  /* 地面网格已由背景图自带 */
  canvas{ position:absolute; display:block; }
  #statueCv{ left:30.9%; bottom:41.0%; width:23%; height:54%; }
  #archetCv{ left:61.4%; bottom:34.0%; width:25%; height:45%; cursor:pointer; transition:filter .15s; }
  #archetCv:hover{ filter:drop-shadow(0 0 10px rgba(255,220,120,.85)); }
  /* 震颤改由 spine 内部位移实现，避免 CSS transform 干扰 WebGL 画布 */

  .blueFg{                       /* 部署格顶边前景线：2px 粗，左端延长 1/4 格 */
    position:absolute; left:65.76%; bottom:37.63%; width:16.46%; height:4px;
    background:#48c2eb; border-radius:2px; z-index:9; pointer-events:none;
    box-shadow:0 0 4px rgba(72,194,235,.90), 0 0 10px rgba(72,194,235,.50),
               0 1px 0 rgba(255,255,255,.25) inset;
  }
  .bubbleWrap{
    position:absolute; left:27.5%; bottom:6%; width:44%; max-width:460px; z-index:3;
    opacity:0; pointer-events:none;
    transform:rotate(-1.2deg) scale(.86);
    transition:opacity .18s ease, transform .18s cubic-bezier(.3,1.6,.5,1);
  }
  .bubbleWrap.on{ opacity:1; transform:rotate(-1.2deg) scale(1); }
  .bubble{
    position:relative; padding:20px 34px 22px 44px; box-sizing:border-box;
    aspect-ratio:2.72 / 1; display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(3px 5px 0 rgba(0,0,0,.14));
  }
  .bshape{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .bubbleImg{                          /* 完整版 PS 字体 */
    position:relative; display:block; margin:0 auto;
    max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.12));
  }
  .bubble .l1, .bubble .l2{ position:relative; display:block; text-align:center; }
  .bubble .l1{
    font-size:clamp(19px,3.1vw,34px); font-weight:400; letter-spacing:.04em; color:#c08a44;
    text-shadow:0 3px 7px rgba(0,0,0,.55);
  }
  .bubble .l1, .bubble .l2{ opacity:.8; }          /* 整体透明度 80% */
  .bubble .l2{
    margin-top:4px; font-size:clamp(21px,3.2vw,36px); font-weight:400; letter-spacing:.12em; color:#b08858;
    text-shadow:0 3px 7px rgba(0,0,0,.55);
  }
  .seg{ display:inline-block; font-style:normal; }
  .artImg{                              /* 用户 PS 改好的彩云字 */
    height:1.50em; width:auto; vertical-align:-0.26em;
    transform:rotate(-5deg);
    position:relative; left:-5px; top:4px;        /* 往左下角一点 */
    margin-right:-2px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.10));  /* 投影透明度降低 */
  }
  /* 弧度：三段分别微旋 + 微移，模拟沿弧排布 */
  .s1{ transform:rotate(-5deg) translateY(3px); }
  .s2{ transform:rotate(-1deg) translateY(-1px); }
  .s3{ transform:rotate(4deg) translateY(3px); }
  .bubble .l2 .seg{ transform:rotate(0deg) translateY(1px) scaleX(.94); }
  /* 彩云艺术字：多彩渐变 + 蓬松白描边 + 立体投影 */
  .bubble .art{ position:relative; display:inline-block; }
  .bubble .art::before{                              /* 内部填色层 */
    content:attr(data-t); position:absolute; left:0; top:0; z-index:-1;
    font-family:inherit; font-size:inherit; font-weight:inherit; letter-spacing:inherit;
    color:#ff8c1e; background:none;
    -webkit-text-stroke:7px #ff8c1e; paint-order:stroke fill;
    text-shadow:none;
  }
  .bubble .art{
    font-family:'Microsoft YaHei',sans-serif;
    font-weight:400; font-size:1.34em; letter-spacing:.02em;
    color:#ff8c1e;                                  /* 原图的橙色 */
    -webkit-text-stroke:1.4px #fff7ea; paint-order:stroke fill;
    text-shadow:0 3px 6px rgba(80,40,0,.45), 0 0 10px rgba(255,170,60,.55);
    background:none; -webkit-background-clip:border-box; background-clip:border-box;
    filter:none; line-height:1.1;
  }
  .err{ color:#b3261e; font-size:.85rem; white-space:pre-wrap; margin-top:6px; }
  /* 右下角落款：低调小字。固定在视口右下角（屏幕再怎么滚都待在原处），
     pointer-events:none —— 它永远不吃点击，不会挡住弦宝那块 canvas。
     窄屏字号跟着 clamp 缩，允许折行，所以不会溢出、也不会盖住舞台。 */
  .sign{
    position:fixed; z-index:10; pointer-events:none;
    right:clamp(10px,2vw,20px); bottom:clamp(8px,1.6vh,14px);
    max-width:calc(100vw - 1.5rem);
    text-align:right;
    font-size:clamp(.66rem,1.7vw,.76rem); line-height:1.5;
    color:var(--c-text-muted); opacity:.85;
  }
</style>

<!-- 右下角落款（position:fixed 在 CSS 里，pointer-events:none 不挡操作）。
     注意「挚友」和「澄净羽之颂」中间那个空格是刻意留的。 -->
<p class="sign">恭喜你发现了隐秘页面！页面制作人：挚友 澄净羽之颂</p>

<script>
/* 全局错误捕获：任何未捕获异常都直接写到页面上，方便定位 */
window.addEventListener('error', function (e) {
  var b = document.getElementById('err');
  if (b) { b.textContent += '✗ 未捕获错误: ' + (e.message || e.error) + ' @' + e.lineno + ':' + e.colno + '\n'; }
});
</script>
<script src="./runtime/spine-webgl.min.js"></script>
<script>
(function () {
  "use strict";
  var errBox = document.getElementById('err'), stBox = document.getElementById('status');
  function fail(m) { errBox.textContent += m + "\n"; console.error(m); }
  function setStatus() { /* 调试输出已关闭 */ }
  if (typeof spine === 'undefined') { fail('✗ spine-webgl.js 未加载（检查 runtime/ 目录）'); return; }
  setStatus('boot', 'spine 运行时已就绪，开始加载资源…');

  // ★ 纵向拉伸系数（觉得扁就调大，觉得瘦长就调小）
  var Q = new URLSearchParams(location.search);
  var STRETCH = { statue: +(Q.get('st') || 1.0), archet: +(Q.get('sa') || 1.0) };

  var WGL = spine.webgl || {};
  function cls(n) { return WGL[n] || spine[n]; }

  // ───── 视图：可同时渲染多个骨架（用于跨骨架交叉淡入淡出）─────
  function View(canvasId) {
    var cv = document.getElementById(canvasId);
    var gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: false });
    if (!gl) { fail('✗ ' + canvasId + ' 无法获取 WebGL'); return null; }
    this.cv = cv; this.gl = gl;
    var SR = cls('SceneRenderer');
    if (!SR) { fail('✗ 找不到 SceneRenderer'); return null; }
    this.renderer = new SR(cv, gl);
    this.renderer.camera.position.x = 0;
    this.renderer.camera.position.y = 0;
    this.pairs = {};                 // key -> {skel,state,anims,b,alpha}
    this.draw = [];                  // 本帧要画的 key 列表
    this.mirror = false;
    this.last = performance.now();
    var self = this, errOnce = false;
    (function loop(now) {
      try {
        var dt = Math.min((now - self.last) / 1000, 0.05); self.last = now;
        var w = cv.clientWidth | 0, h = cv.clientHeight | 0;
        if (w && h && (cv.width !== w || cv.height !== h)) { cv.width = w; cv.height = h; }
        if (self.draw.length) {
          var cam = self.renderer.camera;
          // ★ 真正的坑：本构建的 SceneRenderer.begin() 不设置 GL 视口，必须自己设
          self.gl.viewport(0, 0, cv.width, cv.height);
          self.renderer.begin();
          for (var i = 0; i < self.draw.length; i++) {
            var p = self.pairs[self.draw[i]];
            if (!p || p.alpha <= 0.001) { continue; }
            p.state.update(dt);
            p.state.apply(p.skel);
            if (self.shake > 0) {                      // spine 内部震颤
              self.shake = Math.max(0, self.shake - dt * 3.2);
              p.skel.x = Math.sin(performance.now() / 22) * 9 * self.shake;
            } else if (p.skel.x) { p.skel.x = 0; }
            p.skel.scaleX = (self.mirror ? -1 : 1) * Math.abs(p.sx0 || 1) * (p.sxMul || 1);
            p.skel.scaleY = Math.abs(p.sy0 || 1) * (p.syMul || 1);
            p.skel.updateWorldTransform();
            var col = p.skel.color; col.a = p.alpha;
            // 相机按主骨架包围盒自适应（长宽比与画布一致 → 不拉伸；留 10% 边距）
            if (i === 0 && p.b && cv.width && cv.height) {
              var asp = cv.width / cv.height;
              var need = Math.max(p.b.w, p.b.h * asp) * 1.02;
              cam.viewportWidth = need; cam.viewportHeight = need / asp;
              cam.position.x = p.b.ox + p.b.w / 2;
              cam.position.y = p.b.oy + p.b.h / 2;
              cam.update();
            }
            self.renderer.drawSkeleton(p.skel, true);
          }
          self.renderer.end();
        }
      } catch (e) {
        if (!errOnce) { errOnce = true; fail('✗ 渲染异常(' + canvasId + ')：' + e.message); }
      }
      requestAnimationFrame(loop);
    })(performance.now());
  }

  View.prototype.load = function (key, dir, name, cb, syMul) {
    var self = this;
    setStatus(dir, '加载 ' + dir + ' …');
    var AM = cls('AssetManager');
    var mgr = new AM(this.gl, dir + '/');
    mgr.loadTextureAtlas(name + '.atlas');
    mgr.loadBinary(name + '.skel');
    (function wait() {
      if (!mgr.isLoadingComplete()) { setTimeout(wait, 40); return; }
      try {
        var loader = new spine.AtlasAttachmentLoader(mgr.get(name + '.atlas'));
        var data = new spine.SkeletonBinary(loader).readSkeletonData(mgr.get(name + '.skel'));
        var skel = new spine.Skeleton(data);
        var state = new spine.AnimationState(new spine.AnimationStateData(data));
        var o = new spine.Vector2(), s = new spine.Vector2();
        skel.setToSetupPose(); skel.updateWorldTransform(); skel.getBounds(o, s);
        self.pairs[key] = {
          skel: skel, state: state, alpha: 0, syMul: syMul || 1, sxMul: 1, sx0: skel.scaleX, sy0: skel.scaleY,
          anims: data.animations.map(function (a) { return a.name; }),
          b: { ox: o.x, oy: o.y, w: Math.max(s.x, 1), h: Math.max(s.y, 1) }
        };
        setStatus(dir, '✓ ' + name + ' 动作: ' + self.pairs[key].anims.join(' / '));
        cb && cb(self.pairs[key]);
      } catch (e) { fail('✗ ' + name + ' 解析失败：' + e.message); setStatus(dir, '解析失败：' + e.message); }
    })();
  };

  View.prototype.anim = function (key, words) {
    var p = this.pairs[key]; if (!p || !p.anims.length) { return null; }
    for (var i = 0; i < words.length; i++) {
      var re = new RegExp(words[i], 'i');
      var hit = p.anims.filter(function (n) { return re.test(n); })[0];
      if (hit) { return hit; }
    }
    return p.anims[0];
  };

  // ───── 雕像：待机循环 ─────
  // 弦宝那套骨架比雕像大得多（.skel 314KB + 贴图 157KB vs 102+59KB），
  // 所以**挂在雕像加载完成之后**再拉：舞台和雕像先出来，弦宝随后补上。
  // 不用 requestIdleCallback 单独延后 —— 它在这么小的页面上立刻就是 idle，
  // 实测 49ms 就开抢了，等于没延后。这里用"雕像就绪"这个确定事件，另配一个兜底超时。
  var startArchetLater = null, archetStarted = false;
  var statue = new View('statueCv');
  if (statue) {
    statue.load('s', './statue', 'enemy_10157_mnggyl', function (p) {
      var a = statue.anim('s', [Q.get('statue') || 'B_Idle', 'B_Idle', 'A_Idle', 'Default']);
      p.state.setAnimation(0, a, true);
      p.alpha = 1; statue.draw = ['s'];
      statue.idleName = a;
      statue.atkName = statue.anim('s', [Q.get('satk') || '^B_Attack$', 'B_Attack', 'A_Attack']);
      p.state.data.setMix(a, statue.atkName, 0.10);
      p.state.data.setMix(statue.atkName, a, 0.25);
      p.state.addListener({ complete: function () { p.state.setAnimation(0, statue.idleName, true); } });
      setStatus('statue', '雕像: ' + a + ' → 点击播 ' + statue.atkName);
      if (startArchetLater) { startArchetLater(); }
    }, STRETCH.statue);
  }

  // ───── 空弦：战斗骨架（站姿 Idle ↔ Attack，用官方 setMix 平滑混合）─────
  var archet = new View('archetCv');
  var bubble = document.getElementById('bubbleWrap');
  var bubbleTimer = null, busy = false;

  function showBubble() {
    // 气泡图 143KB，原来跟着首屏一起下；改成第一次弹出来时才取（data-src → src）
    var bi = bubble.querySelector('.bubbleImg');
    if (bi && !bi.getAttribute('src')) { bi.setAttribute('src', bi.getAttribute('data-src')); }
    bubble.classList.add('on');
    if (bubbleTimer) { clearTimeout(bubbleTimer); }
    bubbleTimer = setTimeout(function () { bubble.classList.remove('on'); }, 2200);
  }
  if (Q.get('show')) { bubble.classList.add('on'); }   // ?show=1 预览对话框

  if (archet && bubble) {
    archet.mirror = true;                      // 左右镜像（面朝雕像）
    /*
      延后加载弦宝那套骨架：.skel 314KB + 贴图 157KB，比雕像那一套（102+59KB）大得多。
      原来的顺序是两套一起抢带宽，结果舞台和雕像也要等；现在先让舞台 + 雕像出来，
      弦宝等首屏空下来（requestIdleCallback）再补上。
    */
    var loadArchet = function () {
    archet.load('atk', './archet_battle', 'char_332_archet', function (pair) {
      var atkName = archet.anim('atk', [Q.get('atk') || '^Attack$', 'Attack', 'Skill_1']);
      var idleName = archet.anim('atk', [Q.get('idle') || '^Idle$', 'Idle', 'Default']);  // 默认：战斗正面 Idle
      // 官方动画混合：来回都有过渡（秒）
      pair.state.data.setMix(idleName, atkName, 0.15);
      pair.state.data.setMix(atkName, idleName, 0.30);
      pair.state.setAnimation(0, idleName, true);
      pair.alpha = 1;
      archet.draw = ['atk'];

      pair.state.addListener({
        complete: function () {
          pair.state.setAnimation(0, idleName, true);   // 播完带回混合地切回待机
          busy = false;
        }
      });

      archet.cv.addEventListener('click', function () {
        if (busy) { return; }
        busy = true;
        pair.state.setAnimation(0, atkName, false);      // 空弦立刻出招
        setTimeout(function () {                          // ← 雕像与对话框延迟 1 秒再出现
          if (statue && statue.atkName && statue.pairs.s) {
            statue.pairs.s.state.setAnimation(0, statue.atkName, false);
            statue.shake = 0.9;                           // spine 内部震颤（不用 CSS transform）
            setStatus('statueHit', '雕像 → 正在播 ' + statue.atkName);
            setTimeout(function () { setStatus('statueHit', '雕像 → 已回 ' + statue.idleName); }, 900);
          }
          showBubble();
        }, 750);
      });
      setStatus('hint', '当前：空弦 idle=' + idleName + ' atk=' + atkName + ' ｜ 可用 ?idle=Idle&atk=Skill_1&statue=B_Idle 切换');
    }, STRETCH.archet);
    };
    // 交出去、等雕像就绪时调用；万一雕像那边没起来，2.5 秒后自己兜底
    startArchetLater = function () {
      if (archetStarted) { return; }
      archetStarted = true;
      loadArchet();
    };
    window.setTimeout(function () { if (startArchetLater) { startArchetLater(); } }, 2500);
  }})();
</script>
</body>
</html>
