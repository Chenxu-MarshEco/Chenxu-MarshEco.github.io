name: 部署到 GitHub Pages

on:
  # 推送到 main 分支时自动构建并发布
  push:
    branches: [main]
  # 也可以在仓库的 Actions 页面手动点一下运行
  workflow_dispatch:

# 只有拥有这些权限，工作流才能把产物发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，新的推送会取消正在排队的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # =================================================================
  # 发布门卫（2026-10-06 加）
  #
  # 用户的要求：「SSW的机器人每天都需要推送文章 让它推送到铃忆的冰室日记的文章
  # 无需同意也能推送 但是删改其他页面需要同意」。
  # GitHub 的分支保护只能按"人"放行、不能按"改了哪些文件"放行，所以批准挪到
  # **发布这一步**：推送照旧推得上来，但没被放行的改动**不会上线**。
  #
  # 判定规则和放行名单都在 tools/publish/gate.mjs 头上（一个 ALLOW 数组就是规则）。
  # 这里只是把这次推送的上下文喂给它：谁推的、什么事件、前后 SHA、改动清单要读仓库。
  # 它退出码非 0 = 这次不构建、不发布，你会在 Actions 里看到原因（也会收到失败通知）。
  # 拦住之后要发布：审一遍 → Actions →「部署到 GitHub Pages」→ Run workflow（选 main）。
  #
  # ⚠ 这个 job 不下载图片仓库的任何东西（只需要那个脚本），改动清单是问一次
  #    GitHub 的 compare 接口拿的 —— 不给 runner 增加一次全量 clone。
  # =================================================================
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 判定这次推送能不能直接发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: node tools/publish/gate.mjs

  build:
    # 门卫放行了才构建；而且只认 main —— 在别的分支上手动跑一次只会校验工作流本身，不会发布
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 要求 Node >= 22.12.0，这里用本地验证过的 24
          node-version: 24
          cache: pnpm

      # ---------------------------------------------------------------
      # 把 node_modules 也缓存起来（setup-node 的 cache: pnpm 只缓存 pnpm 的
      # **下载仓库**，每次仍要把依赖重新链接进 node_modules）。
      # 键里带 pnpm-lock.yaml 的哈希：锁文件没变就直接复用，省掉一遍安装。
      # ---------------------------------------------------------------
      - name: 缓存 node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: nm-${{ runner.os }}-

      # ---------------------------------------------------------------
      # 缓存图片优化产物（public/img/opt）。
      # 这份产物本来不进仓库（.gitignore 里排掉了：一张图四五个变体，进仓库会翻好几倍），
      # 于是**每次部署都要把三百多张图重编一遍**（AVIF 编码是大头，2 核 runner 上要几分钟，
      # 发布就是在这儿等的）。管线自己按「源文件大小 + mtime + 内容哈希」判断哪些不用重编，
      # 所以只要把上一轮的 opt/ 还给下一次就行 —— 变了的那几张照旧会重编。
      # key 里带上工具自己的哈希：一改质量档位（= 换一套产物）键就变，不会吃到旧产物。
      # ---------------------------------------------------------------
      - name: 缓存图片优化产物
        uses: actions/cache@v4
        with:
          path: public/img/opt
          key: imgopt-${{ runner.os }}-${{ hashFiles('tools/images/optimize.mjs', 'public/img/**') }}
          restore-keys: imgopt-${{ runner.os }}-

      - name: 安装依赖
        # --prefer-offline：能从缓存拿到的就别再联网问一遍
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 构建站点
        run: pnpm build

      # ---------------------------------------------------------------
      # 产物里最占地方的是图片（本地量：dist 62MB，其中优化产物 31MB、
      # 原图 19MB、音频 9MB）。这个小脚本把**构建后没人引用**的文件删掉，
      # 只删"清单里有变体、而且整个 dist 里一处都没提到"的原图 —— 删错了
      # 会有裂图，所以 no-broken-assets 那支验收在本地每次都量。
      # ---------------------------------------------------------------
      - name: 清掉产物里没人引用的原图
        run: node tools/images/prune-dist.mjs

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # 同上：只发布 main 的产物
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
