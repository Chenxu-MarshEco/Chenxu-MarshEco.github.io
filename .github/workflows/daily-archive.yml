name: 每日存档（聊天室 + 画板）

# ============================================================================
# 黎语堂：每天把"昨天"的聊天记录和画板搬进仓库（2026-10-09 建）
# ----------------------------------------------------------------------------
# 用户原话：「每天保存一次聊天记录 …… 保存的聊天记录最好可以不调用腾讯云的额度
# 例如保存在本地仓库？但是需要所有用户都能搜索」。
#
# 这一份干的就是"搬"，而且**严格分成三段，顺序不能换**（2026-10-10 改的）：
#   ① 搬（`--yesterday`，不带 --prune）：向云函数要昨天那一整天 ——
#      聊天室走 LT_ADMIN_CHAT_DAY，文字写成 src/data/chat/<日>.json、
#      图片解成 public/img/chat/<日>/*.webp、头像按内容去重放进 public/img/chat/avatars/；
#      画板走 LT_ADMIN_DRAW_DAY（**分页取**，因为一次返回曾经超过腾讯云 6MB 上限），
#      写成 src/data/draw/<日>.json + public/img/draw/<日>.svg。两步互不拖累。
#   ② 提交推送（只提交，**不碰云端**）。推送会触发既有的部署工作流（deploy.yml），
#      那边有发布门卫把关：**只放行存档那几个路径**（见 tools/publish/gate.mjs 的 ALLOW）。
#   ③ 提交成功之后才清云端（`--prune-only`）—— 这一步不可逆，放最后。
#
# ⚠⚠ 为什么必须是"先提交、后清理"：2026-10-09 那天是一趟跑完（搬完立刻抹云端），
#   结果画板那一枪撞上 6MB 上限失败 → 脚本 exit 1 → **提交那一步根本没执行**，
#   而聊天室的 5 张图 base64 已经被抹掉了。用户第二天看到的就是"昨天的聊天和画都没保存"，
#   那 5 张图至今只剩一条指向空气的路径（救不回来）。现在清理那一步有两个前提：
#   搬的时候没报错 + 这一次确实有东西提交（另外清理自己还有对账闸门，见存档脚本）。
#
# 为什么要自己提交（而不是让云函数去推）：云函数里不放任何 GitHub 凭据。
#
# ⚠ 两件必须先在仓库里配好的事（不然这个工作流会失败）：
#   ① Settings → Secrets and variables → Actions → New repository secret：
#      名字 `LT_ADMIN_PASSWORD`，值 = 你在评论区小齿轮里设的**站长密码原文**；
#   ② 这个工作流的 `permissions: contents: write` —— 全仓唯一一处写权限，只给它。
# ============================================================================

on:
  schedule:
    # 北京时间 04:00（GitHub 的 cron 是 UTC，20:00 UTC = 次日 04:00 北京）。
    # 为什么是四点而不是零点：用户要求"每天保存一次"放在凌晨四点，
    # 于是切天点是**北京时间 04:00** —— 04:00 这一跑，存下的正好是「昨天04:00 → 今天04:00」那一整天
    # （深夜 23:30 和 00:30 属于同一天，不会把一夜的聊天拆成两栏）。
    - cron: '0 20 * * *'
  # 也能手动点一下（补档、或者刚上线想马上试一次）
  workflow_dispatch:
    inputs:
      day:
        description: '要补哪一天（yyyy-mm-dd；留空 = 北京时间昨天）'
        required: false
        default: ''

permissions:
  contents: write # 存档要往仓库写文件（全仓唯一一处写权限）

# 同一条流水线一次只跑一个；存档不能被取消（跑到一半取消会留下半份文件）
concurrency:
  group: daily-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          # 提交推送要能 rebase（浅克隆会让 pull --rebase 变成一场噩梦）
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 把昨天的话和画搬进仓库
        id: fetch
        # ⚠ 这一条**故意**允许失败：2026-10-10 04:17 那次就是"聊天室搬好了、画板那一枪失败"
        #   （响应体超过腾讯云 6MB 上限），脚本 exit 1 之后整个 job 立刻结束 ——
        #   连"提交"那一步都没走到，已经写好的聊天室存档随 runner 一起没了。
        #   现在失败也往下走：能提交的先提交，最后再用一条步骤把这次跑标红。
        continue-on-error: true
        env:
          LT_ADMIN_PASSWORD: ${{ secrets.LT_ADMIN_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            node tools/liyutang-archive.mjs --day "${{ github.event.inputs.day }}"
          else
            node tools/liyutang-archive.mjs --yesterday
          fi

      - name: 看看有没有东西要提交
        id: changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "今天没有新东西可存（这一天没人说话，或者已经存过了）"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            git status --porcelain | head -20
          fi

      - name: 提交并推送（先拉后推，永不强推）
        if: steps.changed.outputs.changed == '1'
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # ⚠ 用站里那条统一的发布路径（tools/git/sync.mjs）：它会先探连通 → add/commit →
          #   pull --rebase --autostash → push，被拒会自动再拉再推，真撞车就原地停下、
          #   什么都不推。**别在这儿手写 git push，更别加 -f。**
          # 提交信息里的时间用**北京时间**（runner 是 UTC；这一跑发生在北京 04:00，
          # 用 date -u 会写成前一天 20:00，跟"存的是哪一天"对不上）。
          node tools/git/sync.mjs publish --message "存档：聊天室 + 画板（北京时间 $(TZ=Asia/Shanghai date '+%F %H:%M')）"

      - name: 提交成功之后再清云端（不可逆那一步放最后）
        # 条件是"搬的时候没报错 + 这一次真的有东西提交上去"。
        # 2026-10-09 的教训：先抹云端、再提交，中间任何一步失败 = 云端那份没了、仓库里也没有。
        if: steps.fetch.outcome == 'success' && steps.changed.outputs.changed == '1'
        env:
          LT_ADMIN_PASSWORD: ${{ secrets.LT_ADMIN_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            node tools/liyutang-archive.mjs --day "${{ github.event.inputs.day }}" --prune-only
          else
            node tools/liyutang-archive.mjs --yesterday --prune-only
          fi

      - name: 搬的时候出错就把这次跑标红（已经提交的部分留着，云端那份也没动）
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::存档脚本报错了（原因在上面『把昨天的话和画搬进仓库』那一步的日志里）。已经成功搬下来的部分已经提交推送；云端那一份没被清理，修好之后重跑这个工作流即可。"
          exit 1
